name: Build and release machine images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/release.yml
      - VERSION
      - machine/**
      - scripts/Dockerfile
      - scripts/machine-image.sh

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "VERSION is not a semantic version: ${version}" >&2
              exit 1
          fi

          release_tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.machine_dir }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        machine_dir:
          - machine/riscv64/microchip-icicle-kit
          - machine/riscv64/sifive_u

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load machine metadata
        id: machine
        env:
          MACHINE_DIR: ${{ matrix.machine_dir }}
        run: |
          set -euo pipefail

          source "${MACHINE_DIR}/machine.conf"
          : "${BUILDROOT_DEFCONFIG:?BUILDROOT_DEFCONFIG is required}"
          : "${RELEASE_ASSET_PREFIX:?RELEASE_ASSET_PREFIX is required}"

          if ! declare -p REQUIRED_IMAGES 2>/dev/null | grep -q '^declare -a '; then
              echo "REQUIRED_IMAGES must be an indexed array" >&2
              exit 1
          fi
          if (( ${#REQUIRED_IMAGES[@]} == 0 )); then
              echo "REQUIRED_IMAGES must not be empty" >&2
              exit 1
          fi

          if [[ ! "${BUILDROOT_DEFCONFIG}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "invalid Buildroot defconfig: ${BUILDROOT_DEFCONFIG}" >&2
              exit 1
          fi
          if [[ ! "${RELEASE_ASSET_PREFIX}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "invalid release asset prefix: ${RELEASE_ASSET_PREFIX}" >&2
              exit 1
          fi
          for image in "${REQUIRED_IMAGES[@]}"; do
              case "${image}" in
                  ""|/*|.|..|../*|*/./*|*/../*|*/.|*/..)
                      echo "invalid required image path: ${image}" >&2
                      exit 1
                      ;;
              esac
          done

          echo "defconfig=${BUILDROOT_DEFCONFIG}" >> "${GITHUB_OUTPUT}"
          echo "asset_prefix=${RELEASE_ASSET_PREFIX}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Buildroot images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: scripts/Dockerfile
          target: export
          build-args: |
            BUILDROOT_DEFCONFIG=${{ steps.machine.outputs.defconfig }}
          outputs: type=local,dest=output
          cache-from: type=gha,scope=${{ steps.machine.outputs.asset_prefix }}
          cache-to: type=gha,mode=max,scope=${{ steps.machine.outputs.asset_prefix }}

      - name: Package release asset
        id: package
        env:
          ASSET_PREFIX: ${{ steps.machine.outputs.asset_prefix }}
          MACHINE_DIR: ${{ matrix.machine_dir }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes zstd

          source "${MACHINE_DIR}/machine.conf"
          test -d output/images
          for image in "${REQUIRED_IMAGES[@]}"; do
              test -f "output/images/${image}"
          done

          asset="${ASSET_PREFIX}-${RELEASE_TAG}.tar.zst"
          mkdir -p dist
          tar \
              --create \
              --use-compress-program="zstd -T0 -10" \
              --file="dist/${asset}" \
              --directory=output \
              images
          (
              cd dist
              sha256sum "${asset}" > "${asset}.sha256"
          )

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.machine.outputs.asset_prefix }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release candidates
        run: |
          set -euo pipefail

          shopt -s nullglob
          archives=(dist/*.tar.zst)
          checksums=(dist/*.tar.zst.sha256)
          if (( ${#archives[@]} == 0 || ${#archives[@]} != ${#checksums[@]} )); then
              echo "release archive/checksum set is incomplete" >&2
              exit 1
          fi

          (
              cd dist
              for checksum in *.tar.zst.sha256; do
                  sha256sum --check "${checksum}"
              done
          )

      - name: Move release tag to this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          git tag --force "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push --force origin "refs/tags/${RELEASE_TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: QEMU machine images ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.zst
            dist/*.tar.zst.sha256

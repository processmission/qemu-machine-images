name: Build and release machine images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts or publish a release
        required: true
        default: build
        type: choice
        options:
          - build
          - release
      machine:
        description: Machine directory to rebuild, or all
        required: true
        default: all
        type: string
  push:
    branches:
      - main
    paths:
      - VERSION
      - machine/**/build.hcl

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      machine_matrix: ${{ steps.machines.outputs.machine_matrix }}
      has_builds: ${{ steps.machines.outputs.has_builds }}
      needs_release: ${{ steps.machines.outputs.needs_release }}
      release_policy: ${{ steps.machines.outputs.release_policy }}
      state_tag: ${{ steps.state.outputs.state_tag }}
      target_draft: ${{ steps.state.outputs.target_draft }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ \
              ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "VERSION is not a semantic version: ${version}" >&2
              exit 1
          fi

          release_tag="v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Resolve published release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          state_root="${RUNNER_TEMP}/machine-release-state"
          mkdir -p -- "${state_root}"
          state_tag=-
          target_draft=false
          target_exists=false

          if gh release view \
              "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft > "${state_root}/target.json" 2>/dev/null; then
              state_tag="${RELEASE_TAG}"
              target_draft="$(
                  jq --raw-output '.isDraft' "${state_root}/target.json"
              )"
              target_exists=true
          else
              state_tag="$(
                  gh release list \
                      --repo "${GITHUB_REPOSITORY}" \
                      --exclude-drafts \
                      --exclude-pre-releases \
                      --limit 1 \
                      --json tagName \
                      --jq '.[0].tagName // "-"'
              )"
          fi

          manifest=-
          assets=-
          if [[ "${state_tag}" != - ]]; then
              assets="${state_root}/assets.json"
              gh release view \
                  "${state_tag}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --json assets \
                  --jq '[.assets[].name]' > "${assets}"

              manifest_name="qemu-machine-images-${state_tag}.json"
              if gh release download \
                  "${state_tag}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${manifest_name}" \
                  --dir "${state_root}" >/dev/null 2>&1; then
                  manifest="${state_root}/${manifest_name}"
              fi
          fi

          echo "assets=${assets}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"
          echo "state_tag=${state_tag}" >> "${GITHUB_OUTPUT}"
          echo "target_draft=${target_draft}" >> "${GITHUB_OUTPUT}"
          echo "target_exists=${target_exists}" >> "${GITHUB_OUTPUT}"

      - name: Select machine builds
        id: machines
        env:
          ASSETS: ${{ steps.state.outputs.assets }}
          EVENT_NAME: ${{ github.event_name }}
          MANIFEST: ${{ steps.state.outputs.manifest }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_MACHINE: ${{ inputs.machine }}
          STATE_TAG: ${{ steps.state.outputs.state_tag }}
          TARGET_DRAFT: ${{ steps.state.outputs.target_draft }}
          TARGET_EXISTS: ${{ steps.state.outputs.target_exists }}
        run: |
          set -euo pipefail

          request=auto
          release_policy=none
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
              request="${REQUESTED_MACHINE}"
              if [[ "${MODE}" == release ]]; then
                  if [[ "${REPOSITORY}" == \
                      processmission/qemu-machine-images ]]; then
                      release_policy=draft
                  else
                      release_policy=rolling
                  fi
              fi
          elif [[ "${REPOSITORY}" == \
              processmission/qemu-machine-images ]]; then
              release_policy=draft
          fi
          machine_matrix="$(
              scripts/release-manifest.sh select \
                  "${GITHUB_WORKSPACE}" \
                  "${RELEASE_TAG}" \
                  "${STATE_TAG}" \
                  "${MANIFEST}" \
                  "${ASSETS}" \
                  "${request}"
          )"
          build_count="$(jq --raw-output 'length' <<< "${machine_matrix}")"
          if [[ "${release_policy}" == draft &&
                "${TARGET_EXISTS}" == true &&
                "${TARGET_DRAFT}" == false ]] && (( build_count > 0 )); then
              echo \
                  "release ${RELEASE_TAG} is published; bump VERSION before rebuilding" \
                  >&2
              exit 1
          fi

          has_builds=false
          needs_release=false
          if (( build_count > 0 )); then
              has_builds=true
          fi
          if [[ "${release_policy}" != none ]]; then
              if (( build_count > 0 )) ||
                  [[ "${TARGET_EXISTS}" == false ||
                     "${TARGET_DRAFT}" == true ]]; then
                  needs_release=true
              fi
          fi

          echo "selected machine builds: ${machine_matrix}"
          echo "has_builds=${has_builds}" >> "${GITHUB_OUTPUT}"
          echo "machine_matrix=${machine_matrix}" >> "${GITHUB_OUTPUT}"
          echo "needs_release=${needs_release}" >> "${GITHUB_OUTPUT}"
          echo "release_policy=${release_policy}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.machine_dir }}
    needs: prepare
    if: needs.prepare.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        machine_dir: ${{ fromJSON(needs.prepare.outputs.machine_matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Load machine metadata
        id: machine
        env:
          MACHINE_DIR: ${{ matrix.machine_dir }}
        run: |
          set -euo pipefail

          source "${MACHINE_DIR}/machine.conf"
          : "${RELEASE_ASSET_PREFIX:?RELEASE_ASSET_PREFIX is required}"

          if ! declare -p REQUIRED_IMAGES 2>/dev/null | grep -q '^declare -a '; then
              echo "REQUIRED_IMAGES must be an indexed array" >&2
              exit 1
          fi
          if (( ${#REQUIRED_IMAGES[@]} == 0 )); then
              echo "REQUIRED_IMAGES must not be empty" >&2
              exit 1
          fi

          if [[ ! "${RELEASE_ASSET_PREFIX}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
              echo "invalid release asset prefix: ${RELEASE_ASSET_PREFIX}" >&2
              exit 1
          fi
          for image in "${REQUIRED_IMAGES[@]}"; do
              case "${image}" in
                  ""|/*|.|..|../*|*/./*|*/../*|*/.|*/..)
                      echo "invalid required image path: ${image}" >&2
                      exit 1
                      ;;
              esac
          done

          echo "asset_prefix=${RELEASE_ASSET_PREFIX}" >> "${GITHUB_OUTPUT}"

      - name: Reclaim runner disk space
        run: |
          set -euo pipefail

          df -h /
          sudo rm -rf -- \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /usr/local/.ghcup \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /usr/share/swift
          sudo apt-get clean
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build machine components
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: |
            scripts/docker-bake.hcl
            ${{ matrix.machine_dir }}/build.hcl
          targets: release-components

      - name: Report disk space after build
        if: always()
        run: df -h /

      - name: Assemble machine images
        run: scripts/assemble-machine-images.sh components output

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdisk zstd

      - name: Finalize machine images
        env:
          MACHINE_DIR: ${{ matrix.machine_dir }}
        run: scripts/finalize-machine-images.sh "${MACHINE_DIR}" output/images

      - name: Package release asset
        id: package
        env:
          MACHINE_DIR: ${{ matrix.machine_dir }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          asset="$(
              scripts/package-machine-images.sh \
                  "${MACHINE_DIR}/machine.conf" \
                  output \
                  dist \
                  "${RELEASE_TAG}"
          )"

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.machine.outputs.asset_prefix }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.needs_release == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare release directories
        run: mkdir -p candidates previous release upload

      - name: Download release candidates
        if: needs.prepare.outputs.has_builds == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: candidates
          merge-multiple: true

      - name: Download reusable release assets
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_TAG: ${{ needs.prepare.outputs.state_tag }}
        run: |
          set -euo pipefail

          base_manifest=-
          base_assets=-
          if [[ "${STATE_TAG}" != - ]]; then
              manifest_name="qemu-machine-images-${STATE_TAG}.json"
              if gh release download \
                  "${STATE_TAG}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${manifest_name}" \
                  --dir previous >/dev/null 2>&1; then
                  gh release download \
                      "${STATE_TAG}" \
                      --repo "${GITHUB_REPOSITORY}" \
                      --pattern '*.tar.zst' \
                      --pattern '*.tar.zst.sha256' \
                      --dir previous
                  base_manifest="previous/${manifest_name}"
                  base_assets=previous
              fi
          fi

          echo "base_assets=${base_assets}" >> "${GITHUB_OUTPUT}"
          echo "base_manifest=${base_manifest}" >> "${GITHUB_OUTPUT}"

      - name: Assemble release assets
        env:
          BASE_ASSETS: ${{ steps.base.outputs.base_assets }}
          BASE_MANIFEST: ${{ steps.base.outputs.base_manifest }}
          BASE_TAG: ${{ needs.prepare.outputs.state_tag }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${BASE_MANIFEST}" == - ]]; then
              BASE_TAG=-
              BASE_ASSETS=-
          fi
          scripts/release-manifest.sh merge \
              "${GITHUB_WORKSPACE}" \
              "${RELEASE_TAG}" \
              "${RELEASE_SHA}" \
              candidates \
              "${BASE_TAG}" \
              "${BASE_MANIFEST}" \
              "${BASE_ASSETS}" \
              release \
              upload

      - name: Check release payload
        id: payload
        run: |
          set -euo pipefail

          has_assets=false
          if compgen -G 'upload/*.tar.zst' >/dev/null; then
              has_assets=true
          fi
          echo "has_assets=${has_assets}" >> "${GITHUB_OUTPUT}"

      - name: Upload changed release assets
        if: steps.payload.outputs.has_assets == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: QEMU machine images ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Prebuilt Buildroot images for the supported QEMU machines.

            This rolling release tracks the latest successful build from `main`.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.prepare.outputs.release_tag }}
          overwrite_files: true
          preserve_order: true
          fail_on_unmatched_files: true
          files: |
            upload/*.tar.zst
            upload/*.tar.zst.sha256

      - name: Verify published release payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          manifest="release/qemu-machine-images-${RELEASE_TAG}.json"
          gh release view \
              "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets > published-assets.json
          scripts/release-manifest.sh verify-payload \
              "${RELEASE_TAG}" \
              "${manifest}" \
              release \
              published-assets.json

      - name: Upload release manifest
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: QEMU machine images ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Prebuilt Buildroot images for the supported QEMU machines.

            This rolling release tracks the latest successful build from `main`.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.prepare.outputs.release_tag }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: upload/qemu-machine-images-*.json

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          manifest="release/qemu-machine-images-${RELEASE_TAG}.json"
          gh release view \
              "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets > published-assets.json
          scripts/release-manifest.sh verify-assets \
              "${RELEASE_TAG}" \
              "${manifest}" \
              release \
              published-assets.json

      - name: Move release tag to this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail

          git tag --force "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push --force origin "refs/tags/${RELEASE_TAG}"
